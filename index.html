<title>REXDH GAME | ريكسد</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* أزرق كهربائي — الفريق الأول والتمييز الأساسي */
  --or:#2a8fe0;--or2:#1c6bb0;--or-grad:linear-gradient(135deg,#eef1f5,#2a8fe0);
  /* أسود بوقاتي شبه كامل */
  --dark:#08080b;--card:#131318;--deep:#030304;
  --txt:#f2f2f2;--muted:#8a8a8a;
  --cat-bg:#131318;
  /* فضي — الفريق الثاني */
  --bl:#e6e6e6;--bl2:#b5b5b5;
  --line:rgba(255,255,255,.10);
  --glow:0 8px 26px rgba(0,0,0,.55);
}
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');
body{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
  background:
    radial-gradient(900px 520px at 15% -10%, rgba(42,143,224,.09), transparent 60%),
    radial-gradient(800px 520px at 100% 110%, rgba(230,230,230,.05), transparent 55%),
    linear-gradient(165deg,#0a0a0d 0%, #0c0c10 48%, #08080b 100%);
  background-attachment:fixed;
  background-size:100% 100%;
  animation:bodyBreathe 22s ease-in-out infinite alternate;
  color:var(--txt);min-height:100vh;overflow:hidden;height:100vh;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:rgba(230,230,230,.18)}
/* ===== خلفية حيّة ناعمة (تنفّس بطيء) — بنفس ألوان الثيم للتناسق ===== */
body::before{content:'';position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(620px 620px at 18% 22%, rgba(42,143,224,.08), transparent 60%),
    radial-gradient(700px 700px at 84% 80%, rgba(111,182,221,.10), transparent 60%);
  filter:blur(22px);will-change:transform,opacity;
  animation:ambient 24s ease-in-out infinite alternate}
@keyframes ambient{
  0%{transform:translate3d(0,0,0) scale(1);opacity:.7}
  50%{transform:translate3d(2.5%,-2%,0) scale(1.09);opacity:1}
  100%{transform:translate3d(-2.5%,2%,0) scale(1.04);opacity:.8}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}body{animation:none}.cp-img,.cat-img,img.fit-contain{animation:none!important}.cp-card::after{display:none}}
/* ===== منحنيات Bugatti: بطيئة البداية، انزلاق فاخر، توقف حريري ===== */
:root{
  --ease-lux:cubic-bezier(.19,1,.22,1);      /* expo-out: انزلاق فاخر */
  --ease-silk:cubic-bezier(.65,.05,.36,1);   /* دخول/خروج حريري */
  --dur-slow:1.4s; --dur-mid:.9s;
}
html{scroll-behavior:smooth}
*{-webkit-tap-highlight-color:transparent}

/* ===== انتقالات الشاشات — أسلوب Bugatti ===== */
.screen{display:none;flex-direction:column;height:100vh;will-change:opacity,transform,filter}
.screen.on{display:flex;animation:screenIn var(--dur-slow) var(--ease-lux)}
@keyframes screenIn{
  0%{opacity:0;transform:translateY(38px) scale(.97);filter:blur(14px) saturate(.6)}
  55%{opacity:1;filter:blur(2px) saturate(.95)}
  100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0) saturate(1)}
}
/* ستارة ضوئية تمسح الشاشة عند التبديل (توقيع Bugatti) */
.screen.on::after{content:'';position:fixed;inset:0;z-index:9998;pointer-events:none;
  background:linear-gradient(105deg,transparent 38%,rgba(42,143,224,.08) 50%,transparent 62%);
  transform:translateX(-100%);animation:sweep 1.5s var(--ease-lux) forwards}
@keyframes sweep{to{transform:translateX(100%)}}

/* الشعار: كشف حرفي متدرّج */
.setup-logo{animation:logoIn 1.6s var(--ease-lux)}
@keyframes logoIn{
  0%{opacity:0;transform:translateY(-20px) scale(.94);letter-spacing:.42em;filter:blur(8px)}
  60%{opacity:1;filter:blur(0)}
  100%{opacity:1;transform:translateY(0) scale(1);letter-spacing:.04em;filter:blur(0)}
}
.setup-logo small{animation:subIn 1.9s var(--ease-lux) both;animation-delay:.35s}
@keyframes subIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:.9;transform:translateY(0)}}

/* ====== SETUP ====== */
#s-setup{align-items:center;justify-content:flex-start;padding:clamp(2.4rem,7vh,4.5rem) 1rem 2rem;overflow-y:auto;gap:1.1rem;position:relative;background:radial-gradient(120% 60% at 50% -8%, rgba(42,143,224,.10), transparent 55%),radial-gradient(90% 50% at 50% 0%, rgba(230,230,230,.05), transparent 60%),linear-gradient(180deg,#040406 0%, transparent 42%)}#s-setup::before{content:"";position:absolute;top:clamp(15rem,32vh,20rem);left:50%;transform:translateX(-50%);width:min(620px,86%);height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);pointer-events:none}
.setup-eyebrow{font-family:ui-monospace,"Space Mono",monospace;font-size:.62rem;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:1rem;display:flex;align-items:center;justify-content:center;gap:.7rem;opacity:0;animation:subIn 1.6s var(--ease-lux) .2s forwards}.setup-eyebrow::before,.setup-eyebrow::after{content:"";width:18px;height:1px;background:var(--bl);opacity:.75}
.setup-logo{position:relative;font-size:clamp(2.6rem,7vw,4.6rem);font-weight:800;background:linear-gradient(180deg,#ffffff,#e6e6e6 70%,#b5b5b5);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-align:center;line-height:1;letter-spacing:.22em;padding-bottom:.5rem;text-indent:.22em;filter:drop-shadow(0 6px 22px rgba(230,230,230,.22))}.setup-logo::after{content:"";position:absolute;left:50%;bottom:.05rem;transform:translateX(-50%);width:0;height:1px;background:linear-gradient(90deg,transparent,var(--or),transparent);animation:heroLine 1.8s var(--ease-lux) .5s forwards}.setup-logo::before{content:"";position:absolute;left:50%;bottom:-.28rem;transform:translateX(-50%);width:0;height:1px;background:linear-gradient(90deg,transparent,var(--bl),transparent);animation:heroLine 2.1s var(--ease-lux) .75s forwards;opacity:.85}@keyframes heroLine{to{width:min(340px,70%)}}
@keyframes bodyBreathe{0%{filter:brightness(1)}100%{filter:brightness(1.06)}}
.setup-logo small{display:block;font-size:.82rem;font-weight:400;color:var(--muted);margin-top:.9rem;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;-webkit-text-fill-color:var(--muted)}
.section-title{font-size:.78rem;font-weight:600;color:var(--or);text-transform:uppercase;letter-spacing:.24em;width:100%;max-width:1150px;display:flex;align-items:center;gap:.7rem}.section-title::before{content:"";width:22px;height:1px;background:var(--or);opacity:.7;flex-shrink:0}
.teams-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;width:100%;max-width:860px}
.team-card{background:linear-gradient(165deg,rgba(19,19,24,.85),rgba(10,10,13,.85));backdrop-filter:blur(8px);border-radius:16px;padding:1rem;border:1px solid var(--line);border-top:3px solid;box-shadow:var(--glow)}
.tc1{border-top-color:var(--or)}.tc2{border-top-color:var(--bl)}
.team-card h3{font-size:.9rem;font-weight:700;margin-bottom:.75rem}
.tc1 h3{color:var(--or)}.tc2 h3{color:var(--bl)}
.inp{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--txt);font-size:.88rem;font-family:inherit;direction:rtl;margin-bottom:6px;transition:.15s}
.inp:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 3px rgba(42,143,224,.22)}
.inp::placeholder{color:#566184}
.add-btn{background:transparent;border:1px dashed #444;border-radius:7px;padding:6px;width:100%;color:#555;cursor:pointer;font-family:inherit;font-size:.8rem;transition:.15s}
.add-btn:hover{border-color:var(--or);color:var(--or)}
/* ===== قسملي الفرق ===== */
/* flex-shrink:0 ضروري: #s-setup عمود مرن بارتفاع 100vh، و overflow:hidden هنا
   يُبطل min-height:auto فينسحق الصندوق إلى ٢ بكسل بدون هذا السطر. */
.split-box{width:100%;max-width:860px;margin:0 auto;background:rgba(255,255,255,.03);border:1px solid var(--line);
  border-radius:12px;overflow:hidden;box-shadow:none;flex-shrink:0}
.split-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  background:transparent;border:0;padding:.55rem .9rem;cursor:pointer;font-family:inherit;transition:background .35s ease}
.split-head:hover{background:rgba(255,255,255,.045)}
.split-box:not(.closed) .split-head{border-bottom:1px solid var(--line)}
.split-title{color:var(--muted);font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:.45rem}
.split-head:hover .split-title{color:var(--txt)}
.split-opt{font-size:.62rem;font-weight:700;color:var(--muted);background:rgba(255,255,255,.06);
  border-radius:99px;padding:.1rem .4rem}
.split-chev{color:var(--muted);font-size:1.1rem;line-height:1;transition:transform .55s var(--ease-lux), color .35s ease}
.split-head:hover .split-chev{color:var(--or)}
.split-box.closed .split-chev{transform:rotate(-90deg)}
/* لا max-height ثابتة: عدد اللاعبين غير محدود، وتوليفة JS تحسب الارتفاع.
   none هنا تضمن ظهور المحتوى كاملاً حتى لو تعطّل JS. */
.split-body{padding:1rem 1.1rem 1.15rem;display:grid;gap:.7rem;overflow:hidden;
  transition:max-height .7s var(--ease-lux), opacity .45s ease, padding .5s ease;max-height:none;opacity:1}
.split-box.closed .split-body{max-height:0;opacity:0;padding-top:0;padding-bottom:0}
.split-label{text-align:center;color:var(--txt);font-weight:800;font-size:.95rem}
.split-step{display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  background:rgba(0,0,0,.28);border:1.5px solid var(--line);border-radius:99px;padding:.32rem}
.stp{width:38px;height:38px;flex:0 0 38px;border-radius:50%;border:0;cursor:pointer;font-family:inherit;
  font-size:1.35rem;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;
  background:var(--or-grad);color:#1a2336;transition:transform .4s var(--ease-lux), filter .3s ease, opacity .3s ease}
.stp:hover:not(:disabled){transform:scale(1.12)}
.stp:active:not(:disabled){transform:scale(.92)}
.stp:disabled{background:#333d55;color:#6b768f;cursor:not-allowed;opacity:.55}
.stp-num{flex:1;text-align:center;color:var(--txt);font-size:1.3rem;font-weight:900;font-variant-numeric:tabular-nums}
.split-names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.5rem}
.split-names .inp{margin:0}
.split-go{background:linear-gradient(135deg,#5fc98b,#43a96c);color:#0f2418;border:0;border-radius:99px;
  padding:.55rem 1rem;font-family:inherit;font-size:.92rem;font-weight:800;cursor:pointer;
  justify-self:center;min-width:180px;box-shadow:0 5px 16px rgba(67,169,108,.2);
  transition:transform .5s var(--ease-lux), box-shadow .5s var(--ease-lux), filter .3s ease}
.split-go:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 10px 24px rgba(67,169,108,.34)}
.split-go:active{transform:scale(.97)}
.split-result{display:none;gap:.6rem;grid-template-columns:1fr 1fr}
.split-result.on{display:grid;animation:cardIn .8s var(--ease-lux)}
.split-res-card{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:.6rem .75rem}
.split-res-card h4{margin:0 0 .35rem;font-size:.9rem;color:var(--or)}
.split-res-card ul{margin:0;padding:0;list-style:none;display:grid;gap:.22rem}
.split-res-card li{color:var(--txt);font-size:.88rem;background:rgba(255,255,255,.04);border-radius:7px;padding:.2rem .45rem}
@media(max-width:560px){.split-result.on{grid-template-columns:1fr}}
.pl-row{display:flex;gap:5px;margin-bottom:5px;align-items:stretch}
.pl-row .inp{flex:1;margin-bottom:0;font-size:.82rem;padding:7px 10px}
.pl-del{background:#3a3a3a;border:1px solid #555;color:var(--muted);width:32px;border-radius:6px;cursor:pointer;font-size:1.1rem;line-height:1;flex-shrink:0;font-weight:700;transition:.15s;font-family:inherit}
.pl-del:hover{background:#7a1f1f;border-color:#ef4444;color:#fff}

/* category picker */
.cat-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:100%;max-width:1150px}
/* ===== بطاقات الفئات — أسلوب Bugatti ===== */
.cp-card{background:var(--card);border-radius:16px;padding:0;text-align:center;cursor:pointer;
  border:2px solid var(--line);user-select:none;overflow:hidden;position:relative;
  box-shadow:0 4px 14px rgba(0,0,0,.5);
  transition:transform .5s var(--ease-lux), box-shadow .5s var(--ease-lux), border-color .3s ease;
  opacity:0;animation:cardIn 1.05s var(--ease-lux) forwards;will-change:transform,opacity}

.cp-card::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.16) 50%,transparent 60%);
  transform:translateX(-140%);transition:transform .7s var(--ease-lux)}
.cp-card:hover::after{transform:translateX(140%)}
.cp-card:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(0,0,0,.6);border-color:rgba(255,255,255,.18)}
@keyframes cardIn{
  0%{opacity:0;transform:translateY(26px) scale(.94);filter:blur(6px)}
  100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}
/* لمعة تمرّ على البطاقة عند المرور (توقيع فاخر) */
.cp-card::after{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.13) 50%,transparent 60%);
  transform:translateX(-130%);transition:transform 1.1s var(--ease-lux)}
.cp-card:hover::after{transform:translateX(130%)}
.cp-card .cp-ico{height:150px;overflow:hidden;position:relative;background:linear-gradient(180deg,#1a1a20,#0d0d11);display:flex;align-items:center;justify-content:center;padding:.4rem}
.cp-img{width:100%;height:150px;object-fit:cover;display:block;
  transition:transform .8s cubic-bezier(.16,1,.3,1), filter .5s ease;
  filter:saturate(.85) brightness(.82);
  animation:cpDrift 14s ease-in-out infinite alternate}
@keyframes cpDrift{0%{transform:scale(1)}100%{transform:scale(1.1)}}
.cp-card:hover .cp-img{animation-play-state:paused}
/* رسومات بخلفية شفافة: تظهر كاملة بلا قصّ، بهامش صغير وبدون تعتيم.
   بلا أي خلفية بيضاء خلفها — التوهّج الأبيض السابق كان يرسم هالة حول
   حواف الرسم الشفاف فيبدو مشوَّهاً (ظهر جليّاً في كرة القدم). */
.cp-img.fit-contain{object-fit:contain;padding:12px;filter:none;background:none}
.cat-img.fit-contain{object-fit:contain;padding:10px;filter:none;background:none}
.cp-img-fb{height:62px;display:flex;align-items:center;justify-content:center;font-size:1.9rem}
.cp-card:hover{transform:translateY(-6px);border-color:rgba(255,255,255,.28);box-shadow:0 14px 34px rgba(0,0,0,.45)}
.cp-card:hover .cp-img{transform:scale(1.14);filter:saturate(1.1) brightness(1)}
.cp-img.fit-contain{transform:scale(1)}
.cp-card .cp-name{font-size:1rem;font-weight:800;color:#fff;line-height:1.3;padding:.6rem .4rem;background:var(--or2);transition:background .3s;letter-spacing:.01em}
.cp-card.sel .cp-info{position:absolute;top:8px;right:8px;z-index:3;width:26px;height:26px;border-radius:50%;background:var(--bl);
  color:#0a0a0d;font-family:serif;font-weight:700;font-style:italic;font-size:.95rem;line-height:26px;text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,.4);border:none;cursor:pointer;transition:transform .15s}
.cp-info:hover{transform:scale(1.12)}
.cp-card.sel{border-color:var(--or);box-shadow:0 0 0 3px rgba(42,143,224,.35),0 10px 28px rgba(42,143,224,.3)}
.cp-card.sel .cp-img{filter:saturate(1.15) brightness(1.05)}
.cp-card.sel .cp-name{color:var(--or);font-weight:700;background:linear-gradient(160deg,rgba(42,143,224,.16),rgba(42,143,224,.04))}
.cp-card.sel::after{content:'✓';position:absolute;top:5px;left:6px;width:19px;height:19px;border-radius:50%;
  background:var(--or-grad);color:#2a1e04;font-size:.68rem;font-weight:900;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.4);animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.sel-hint{font-size:.78rem;color:var(--muted);text-align:center}
.sel-hint span{color:var(--or);font-weight:700}

/* setup bottom */
.setup-opts{background:linear-gradient(165deg,rgba(19,19,24,.85),rgba(10,10,13,.85));backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:.85rem 1.1rem;width:100%;max-width:860px;display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap;box-shadow:var(--glow)}
.setup-opts label{color:var(--muted);font-size:.82rem}
.setup-opts select{background:rgba(15,15,19,.7);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--txt);font-family:inherit;font-size:.82rem;cursor:pointer}
.setup-opts select:focus{outline:none;border-color:var(--or)}
.start-btn{width:100%;max-width:860px;padding:14px;background:var(--or-grad);border:none;border-radius:14px;color:#08080b;font-size:1.1rem;font-weight:900;cursor:pointer;font-family:inherit;transition:.2s;box-shadow:0 6px 20px rgba(42,143,224,.35);letter-spacing:.02em}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(42,143,224,.5)}
.start-btn:active{transform:translateY(0)}

/* ====== BOARD ====== */
#s-board{background:transparent}
.b-header{background:rgba(15,15,19,.75);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:.55rem 1rem;display:flex;align-items:center;gap:.6rem;flex-shrink:0}
.b-logo{background:var(--or-grad);border-radius:10px;padding:.28rem .7rem;font-size:1.1rem;font-weight:900;color:#08080b;flex-shrink:0;box-shadow:0 3px 12px rgba(42,143,224,.3);letter-spacing:.03em}
.turn-pill{background:var(--or-grad);border-radius:20px;padding:.28rem .95rem;font-size:.82rem;font-weight:800;white-space:nowrap;flex-shrink:0;color:#08080b;box-shadow:0 2px 10px rgba(42,143,224,.2);cursor:default;transition:.15s;user-select:none}
/* شارة "نقاط مضاعفة مُفعّلة" — تنتظر السؤال القادم */
.dbl-pending{display:none}
.dbl-pending.on{display:block;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;
  border-radius:20px;padding:.28rem .8rem;font-size:.76rem;font-weight:800;white-space:nowrap;
  flex-shrink:0;box-shadow:0 2px 12px rgba(124,58,237,.45);animation:dblPulse 1.6s ease-in-out infinite}
@keyframes dblPulse{0%,100%{box-shadow:0 2px 12px rgba(124,58,237,.45)}50%{box-shadow:0 2px 20px rgba(124,58,237,.85)}}
.turn-pill:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(42,143,224,.35)}
.turn-pill.t2{background:linear-gradient(135deg,#7ecbf0,#3ba3d6);color:#06283a;box-shadow:0 2px 10px rgba(56,189,248,.22)}
.turn-pill.t2:hover{box-shadow:0 4px 14px rgba(56,189,248,.35)}
.h-mid{flex:1;text-align:center;font-size:.9rem;color:var(--muted)}
.h-ctrl{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.h-btn{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-family:inherit;font-size:.8rem;padding:.35rem .65rem;border-radius:9px;display:flex;align-items:center;gap:.3rem;transition:.15s}
.h-btn:hover{color:var(--txt);background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}

.b-main{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:7px 8px}
.board-section{display:grid;gap:9px;flex:1}
.score-col{display:flex;flex-direction:column;gap:5px}
.score-btn{flex:1;background:linear-gradient(145deg,#243150,#1a2238);border:1px solid var(--line);border-radius:12px;color:var(--or);font-size:1.4rem;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  position:relative;overflow:hidden;
  transition:transform .6s var(--ease-lux), box-shadow .6s var(--ease-lux), background .45s ease;
  opacity:0;animation:btnIn .8s var(--ease-lux) forwards}
@keyframes btnIn{0%{opacity:0;transform:translateY(14px) scale(.9)}100%{opacity:1;transform:translateY(0) scale(1)}}
.score-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(42,143,224,.14) 50%,transparent 70%);
  transform:translateX(-120%);transition:transform 1.1s var(--ease-lux)}
.score-btn:hover::before{transform:translateX(120%)}
.score-btn:hover{background:linear-gradient(145deg,#2c3a5e,#212c48);transform:scale(1.05) translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.45),0 0 0 1px rgba(42,143,224,.5)}
.score-btn:active{transform:scale(.96)}
.score-btn.used{background:rgba(255,255,255,.015);color:rgba(255,255,255,.06);cursor:default;pointer-events:none;box-shadow:none;border-color:transparent}
/* ===== أعمدة الفئات في اللوحة — صور سينمائية ===== */
.cat-col{background:#0f1626;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:0;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.35);position:relative;
  transition:transform .75s var(--ease-lux), box-shadow .75s var(--ease-lux);
  opacity:0;animation:catIn 1.15s var(--ease-lux) forwards;will-change:transform,opacity}
@keyframes catIn{
  0%{opacity:0;transform:scale(.9) translateY(18px);filter:blur(8px)}
  100%{opacity:1;transform:scale(1) translateY(0);filter:blur(0)}
}
.cat-col::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(10,15,26,.95) 0%,rgba(10,15,26,.45) 40%,rgba(10,15,26,.1) 100%)}
.cat-col:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.5)}
.cat-emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
/* صور اللوحة: حركة سينمائية حيّة (Ken Burns) */
.cat-img{width:100%;height:100%;object-fit:contain;display:block;background:linear-gradient(180deg,#1a1a20,#0d0d11);
  transition:filter .6s ease;
  filter:saturate(.9) brightness(.9);
  animation:kenBurns 18s ease-in-out infinite alternate;
  transform-origin:center 35%}
@keyframes kenBurns{
  0%{transform:scale(1.04) translateY(0)}
  100%{transform:scale(1.16) translateY(-2%)}
}
.cat-col:hover .cat-img{filter:saturate(1.1) brightness(1);animation-play-state:paused;transform:scale(1.12)}
/* الرسومات الشفافة: طفو لطيف بدل تقريب كين برنز (كي لا تُقصّ) */
.cat-img.fit-contain{animation:catFloat 9s ease-in-out infinite alternate;transform-origin:center}
@keyframes catFloat{
  0%{transform:translateY(-2px) scale(1)}
  100%{transform:translateY(2px) scale(1.03)}
}
.cat-col:hover .cat-img.fit-contain{transform:scale(1.05);filter:none}
.cp-card:hover .cp-img.fit-contain{filter:none}
/* وهج حي حول الصورة */
.cat-col::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(circle at 50% 40%, rgba(42,143,224,.14), transparent 62%);
  opacity:0;animation:auraPulse 5s ease-in-out infinite}
@keyframes auraPulse{0%,100%{opacity:.25}50%{opacity:.7}}
.cat-img-fb{font-size:3rem;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.cat-name{position:relative;z-index:2;background:linear-gradient(135deg,rgba(42,143,224,.92),rgba(205,160,70,.92));
  backdrop-filter:blur(4px);border-radius:8px;padding:.4rem .7rem;font-size:.95rem;font-weight:800;color:#2a1e04;
  text-align:center;width:calc(100% - .8rem);margin:.4rem;letter-spacing:.01em;box-shadow:0 3px 10px rgba(0,0,0,.35)}

.b-bottom{background:rgba(15,15,19,.8);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:.55rem .9rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:.75rem}
.b-team{display:flex;align-items:center;gap:.55rem}
.score-ctrl{display:flex;align-items:center;gap:.35rem}
.sc-adj{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);font-size:1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;line-height:1}
.sc-adj:hover{background:rgba(255,255,255,.16)}
.sc-val{min-width:50px;text-align:center;font-size:1.5rem;font-weight:900}
.ll-group{display:flex;gap:5px}
.ll-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .15s;position:relative}
.ll-btn:hover:not([disabled]){border-color:var(--or);transform:scale(1.12);box-shadow:0 0 12px rgba(42,143,224,.4)}
.ll-btn[disabled]{opacity:.2;cursor:not-allowed;border-color:#333}
.ll-label{font-size:.65rem;color:var(--muted);white-space:nowrap}
.team-pill{background:var(--or-grad);border-radius:18px;padding:.28rem .95rem;font-size:.85rem;font-weight:800;cursor:pointer;user-select:none;color:#08080b;transition:.15s;box-shadow:0 2px 10px rgba(42,143,224,.25)}
.team-pill:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(42,143,224,.4)}
.b-team:last-child .team-pill{background:linear-gradient(135deg,#5cc9fb,#0ea5e9);color:#04263a;box-shadow:0 2px 10px rgba(56,189,248,.3)}

/* ====== QUESTION OVERLAY ====== */
#q-ov{position:fixed;inset:0;background:rgba(8,12,24,.82);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem;animation:ovIn .7s var(--ease-silk)}
@keyframes ovIn{0%{opacity:0;backdrop-filter:blur(0);background:rgba(8,12,24,0)}100%{opacity:1}}
.q-modal{background:linear-gradient(165deg,#232e4d,#1a2238);border-radius:22px;padding:1.75rem 2rem;max-width:680px;width:100%;border:1px solid rgba(255,255,255,.08);box-shadow:0 24px 70px rgba(0,0,0,.6),0 0 0 1px rgba(42,143,224,.15);position:relative;overflow:hidden;
  animation:modalIn 1.05s var(--ease-lux);will-change:transform,opacity}
@keyframes modalIn{
  0%{opacity:0;transform:translateY(46px) scale(.9);filter:blur(12px)}
  60%{opacity:1;filter:blur(0)}
  100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}
/* الشريط الذهبي يُرسم من اليمين لليسار — لمسة Bugatti */
.q-modal::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--or-grad);
  transform-origin:right;animation:lineDraw 1.2s var(--ease-lux) .15s both}
@keyframes lineDraw{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.q-timer-wrap{margin-bottom:.9rem}
.q-timer-bar{height:8px;background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden}
.q-timer-fill{height:100%;border-radius:99px;transition:width 1s linear,background .3s;background:var(--or);box-shadow:0 0 10px rgba(42,143,224,.5)}
.q-timer-lbl{font-size:.75rem;color:var(--muted);text-align:left;margin-top:.25rem}
.q-pts-lbl{font-size:1.45rem;font-weight:900;background:var(--or-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:.15rem}
.q-cat-tag{font-size:.78rem;color:var(--muted);text-align:center;margin-bottom:1rem}
.q-vis{font-size:5rem;text-align:center;line-height:1;margin-bottom:.7rem;display:none}
.q-vis.on{display:flex;justify-content:center;align-items:center}
.q-vis img{max-width:280px;max-height:250px;width:auto;object-fit:contain;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.5);border:2px solid #555}
.q-vis img.logo-img{background:#fff;padding:14px;object-fit:contain;max-height:130px}
.q-txt{font-size:1.35rem;font-weight:700;text-align:center;line-height:1.5;color:var(--txt);margin-bottom:1.25rem;white-space:pre-line}
.q-opts{display:none;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:1.1rem}
.q-opts.visible{display:grid}
.q-answer-box{display:none;background:rgba(34,90,58,.35);border:1.5px solid rgba(74,222,128,.4);border-radius:12px;padding:14px 20px;font-size:1.18rem;font-weight:700;color:#86efac;text-align:center;margin-bottom:.9rem;animation:fadeIn .3s ease}
.q-answer-box.on{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.q-opt{padding:12px 15px;background:var(--deep);border:1.5px solid #444;border-radius:11px;font-size:.98rem;color:var(--txt);display:flex;align-items:center;gap:7px;transition:all .2s;cursor:default}
.q-opt .ol{width:24px;height:24px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:var(--muted);flex-shrink:0}
.q-opt.ok{background:#14532d;border-color:#22c55e;color:#86efac}.q-opt.ok .ol{background:#22c55e;color:#fff}
.q-opt.no{background:#450a0a;border-color:#ef4444;color:#fca5a5;opacity:.55}.q-opt.no .ol{background:#ef4444;color:#fff}
.q-dbl{display:none;text-align:center;background:#7c3aed;border-radius:7px;padding:3px 10px;font-size:.75rem;font-weight:700;margin-bottom:.5rem}
.q-dbl.on{display:block}
.q-ll-bar{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.9rem;padding:.55rem;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px}
.q-ll-team{display:flex;flex-direction:column;gap:.3rem;align-items:center}
.q-ll-team .team-label{font-size:.72rem;font-weight:800}
.q-ll-team.t1 .team-label{color:var(--or)}
.q-ll-team.t2 .team-label{color:var(--bl)}
.q-ll-btns{display:flex;gap:.35rem;justify-content:center;flex-wrap:wrap}
.q-ll-btn{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);cursor:pointer;font-size:1.05rem;display:flex;align-items:center;justify-content:center;transition:.15s;color:#fff;font-family:inherit;padding:0}
.q-ll-btn:hover:not(:disabled){transform:scale(1.12);border-color:rgba(255,255,255,.4)}
.q-ll-team.t1 .q-ll-btn:hover:not(:disabled){border-color:var(--or);box-shadow:0 0 12px rgba(42,143,224,.4)}
.q-ll-team.t2 .q-ll-btn:hover:not(:disabled){border-color:var(--bl);box-shadow:0 0 12px rgba(56,189,248,.4)}
.q-ll-btn:disabled{opacity:.25;cursor:not-allowed;border-color:#333}
.q-ll-btn.used{background:rgba(0,0,0,.3);color:#444}
.q-acts{display:flex;gap:.6rem}
.qa{flex:1;padding:12px 8px;border:none;border-radius:12px;font-size:.9rem;font-weight:800;cursor:pointer;font-family:inherit;transition:.18s;box-shadow:0 3px 12px rgba(0,0,0,.25)}
.qa:hover:not(:disabled){transform:translateY(-2px)}
.qa:disabled{opacity:.3;cursor:not-allowed}
.qa-rev{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff}
.qa-t1{background:var(--or-grad);color:#08080b}
.qa-t2{background:linear-gradient(135deg,#5cc9fb,#0ea5e9);color:#04263a}
.qa-sk{background:rgba(255,255,255,.07);color:var(--muted);box-shadow:none}.qa-sk:hover{color:var(--txt);background:rgba(255,255,255,.14)}

/* ====== POLL ====== */
.poll-ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:200}
.poll-card{background:var(--card);border-radius:18px;padding:1.5rem;max-width:380px;width:90%;text-align:center;border-top:4px solid var(--or)}
.poll-title{font-size:.95rem;font-weight:700;color:var(--or);margin-bottom:1rem}
.poll-row{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.poll-l{width:20px;font-size:.75rem;font-weight:700;color:var(--muted);text-align:center;flex-shrink:0}
.poll-bw{flex:1;background:var(--deep);border-radius:99px;height:20px;overflow:hidden}
.poll-b{height:100%;border-radius:99px;width:0%;transition:width 1.2s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;justify-content:flex-end;padding-right:7px;font-size:.72rem;font-weight:700;color:#fff}
.poll-p{min-width:32px;text-align:left;font-size:.82rem;font-weight:700}
.poll-close{margin-top:.9rem;padding:9px 24px;background:var(--or);border:none;border-radius:9px;color:#fff;font-weight:700;cursor:pointer;font-family:inherit}

/* ====== RESULT ====== */
#s-result{align-items:center;justify-content:center;background:transparent}
.res-card{background:linear-gradient(165deg,#232e4d,#1a2238);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:2rem;max-width:480px;width:90%;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.6),0 0 0 1px rgba(42,143,224,.15)}
.res-ico{font-size:3.4rem;margin-bottom:.4rem;filter:drop-shadow(0 4px 12px rgba(42,143,224,.4))}
.res-win{font-size:1.9rem;font-weight:900;margin-bottom:.2rem}
.res-sub{color:var(--muted);margin-bottom:1.4rem;font-size:.92rem}
.final-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1.4rem}
.fb{border-radius:14px;padding:1.1rem;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.fb1{border-top:3px solid var(--or)}.fb2{border-top:3px solid var(--bl)}
.fb-n{font-size:.8rem;margin-bottom:.25rem;font-weight:700}
.fb1 .fb-n{color:var(--or)}.fb2 .fb-n{color:var(--bl)}
.fb-s{font-size:2.6rem;font-weight:900}
.fb1 .fb-s{color:var(--or)}.fb2 .fb-s{color:var(--bl)}
.res-btns{display:flex;gap:.6rem;justify-content:center}
.rb{padding:11px 22px;border-radius:11px;font-size:.92rem;font-weight:800;cursor:pointer;font-family:inherit;border:none;transition:.18s}
.rb:hover{transform:translateY(-2px)}
.rb-or{background:var(--or-grad);color:#08080b;box-shadow:0 4px 14px rgba(42,143,224,.35)}
.rb-dk{background:rgba(255,255,255,.07);color:var(--txt);border:1px solid var(--line)}.rb-dk:hover{background:rgba(255,255,255,.14)}

/* misc */
.pts-pop{position:fixed;pointer-events:none;font-size:2.2rem;font-weight:900;animation:popUp .9s ease forwards;z-index:300}
@keyframes popUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(1.5)}}
.toast-el{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:9px;font-weight:700;font-size:.85rem;z-index:400;animation:popUp .9s ease forwards;white-space:nowrap;color:#fff}

/* ===== خلفية Three.js ثلاثية الأبعاد (إضافية — طبقة منفصلة، لا تلمس البقية) ===== */
#three-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;display:block;width:100%;height:100%}

/* ===== لمسة 3D على بطاقات الفئات (GSAP يحرّك rotateX/rotateY وقت hover) ===== */
.cat-picker{perspective:900px}
.cp-card{transform-style:preserve-3d;will-change:transform}
.cp-card .cp-ico,.cp-card .cp-name{transform:translateZ(18px)}

/* ===== أزرار: توهّج عند hover + ارتداد عند click (احتياط CSS إن لم يغطّها GSAP) ===== */
.start-btn,.score-btn,.rb,.ll-btn,.q-ll-btn,.team-pill,.turn-pill{transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .25s ease,filter .25s ease}
.start-btn:hover,.rb:hover{filter:brightness(1.08) saturate(1.1)}
.start-btn:active,.score-btn:active,.rb:active{transform:scale(.95)}

@media (prefers-reduced-motion:reduce){#three-bg{display:none}}

/* ===== ShinyText (منقول من React Bits إلى CSS خالص) — لمعة تمرّ على العنوان =====
   الأصل يحرّك background-position عبر motion/react؛ هنا @keyframes أصلية بنفس
   المدى بالضبط (150% → -50%) فلا حاجة لأي مكتبة. */
@keyframes shineText{0%{background-position:150% center}100%{background-position:-50% center}}
.setup-logo{
  background:linear-gradient(120deg,#b5b5b5 0%,#b5b5b5 35%,#ffffff 50%,#b5b5b5 65%,#b5b5b5 100%);
  background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:logoIn 1.6s var(--ease-lux), shineText 3.2s linear 1.6s infinite}

/* ===== StarBorder (منقول من React Bits إلى CSS خالص) — نجمة تدور حول زر البدء =====
   الأصل مكوّن React يضع divين بتدرّج شعاعي متحرّك؛ هنا نفس البنية بغلاف
   يُنشأ مرة واحدة بجافاسكربت عادي، بألوان الثيم بدل الأبيض. */
/* flex-shrink:0 ضروري (نفس علّة .split-box): #s-setup عمود مرن ومحتواه يفيض،
   فبدونه ينسحق الغلاف إلى ارتفاع الـpadding (6px) ويختفي الزر بصرياً. */
.star-border{position:relative;display:block;width:100%;max-width:860px;border-radius:16px;overflow:hidden;padding:3px 0;flex-shrink:0}
.star-border .sb-top,.star-border .sb-bottom{position:absolute;width:300%;height:50%;opacity:.7;border-radius:50%;z-index:0;pointer-events:none}
.star-border .sb-bottom{bottom:-11px;right:-250%;background:radial-gradient(circle,var(--or),transparent 10%);animation:sbBottom 6s linear infinite alternate}
.star-border .sb-top{top:-11px;left:-250%;background:radial-gradient(circle,var(--bl),transparent 10%);animation:sbTop 6s linear infinite alternate}
.star-border .start-btn{position:relative;z-index:1;display:block;width:100%;max-width:none}
@keyframes sbBottom{0%{transform:translate(0,0);opacity:1}100%{transform:translate(-100%,0);opacity:0}}
@keyframes sbTop{0%{transform:translate(0,0);opacity:1}100%{transform:translate(100%,0);opacity:0}}

/* ===== MagicBento (منقولة تأثيراته فقط، بلا شبكة الديمو) =====
   المكوّن الأصلي شبكة bento جاهزة بست بطاقات إنجليزية ثابتة (Analytics/Dashboard...)
   لا علاقة لها بلعبة أسئلة عربية — فنقلنا التأثيرات وحدها إلى بطاقات الفئات
   الحقيقية: توهّج حدود يتبع المؤشر + بقعة ضوء عامة + جسيمات + موجة عند النقر.
   بلون الثيم (42,143,224) بدل البنفسجي الأصلي. */
.cp-card{--glow-x:50%;--glow-y:50%;--glow-intensity:0;--glow-radius:220px}
.cp-glow{position:absolute;inset:0;padding:2px;border-radius:inherit;pointer-events:none;z-index:4;
  background:radial-gradient(var(--glow-radius) circle at var(--glow-x) var(--glow-y),
    rgba(42,143,224,calc(var(--glow-intensity) * .9)) 0%,
    rgba(42,143,224,calc(var(--glow-intensity) * .45)) 30%, transparent 60%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask-composite:exclude;transition:opacity .3s ease}
.cp-particle{position:absolute;width:4px;height:4px;border-radius:50%;pointer-events:none;z-index:5;
  background:rgba(42,143,224,1);box-shadow:0 0 6px rgba(42,143,224,.6)}
.cp-ripple{position:absolute;border-radius:50%;pointer-events:none;z-index:5;
  background:radial-gradient(circle,rgba(42,143,224,.4) 0%,rgba(42,143,224,.2) 30%,transparent 70%)}
#cp-spotlight{position:fixed;width:800px;height:800px;border-radius:50%;pointer-events:none;z-index:200;opacity:0;
  transform:translate(-50%,-50%);mix-blend-mode:screen;will-change:transform,opacity;
  background:radial-gradient(circle,rgba(42,143,224,.15) 0%,rgba(42,143,224,.08) 15%,rgba(42,143,224,.04) 25%,rgba(42,143,224,.02) 40%,rgba(42,143,224,.01) 65%,transparent 70%)}

@media (prefers-reduced-motion:reduce){
  .setup-logo{animation:logoIn 1.6s var(--ease-lux)}
  .star-border .sb-top,.star-border .sb-bottom{animation:none;opacity:.35}
  .cp-glow,#cp-spotlight{display:none}
}

</style>
</head>
<body>

<canvas id="three-bg" aria-hidden="true"></canvas>

<!-- ====== SETUP ====== -->
<div id="s-setup" class="screen on">
  <div class="setup-logo">REXDH GAME<small>اختار الفئات وابدأ اللعبة</small></div>

  <div class="section-title">الفرق</div>
  <div class="teams-grid">
    <div class="team-card tc1">
      <h3>🔴 الفريق الأول</h3>

   الفكرة: نلف (wrap) الدوال العامة اللي تبنيها اللعبة أصلاً — openQ,
   revealAns, givePoint, showResult — بدون ما نلمس أو نعدّل أي سطر من
   الكود الأصلي (المحمي/المشفّر). كل دالة أصلية تشتغل زي ما هي، وبعدين
   نضيف حركة GSAP فوقها.
   ===================================================================== */
(function () {
  "use strict";

  function wrap(fnName, after) {
    var original = window[fnName];
    if (typeof original !== "function") return;
    window[fnName] = function () {
      var result = original.apply(this, arguments);
      try { after.apply(this, arguments); } catch (e) { /* لا نكسر اللعبة لو صار خطأ بالأنيميشن */ }
      return result;
    };
  }

  /* ---------- 1) فتح السؤال: دخول البطاقة بحركة نابضة ---------- */
  wrap("openQ", function () {
    var modal = document.querySelector(".q-modal");
    if (!modal) return;
    gsap.fromTo(
      modal,
      { opacity: 0, scale: 0.82, y: 40 },
      { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(1.7)" }
    );
    var txt = document.getElementById("q-txt");
    if (txt) {
      gsap.fromTo(
        txt,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, delay: 0.15, ease: "power2.out" }
      );
    }
  });

  /* ---------- 2) كشف الإجابة: نبضة خضراء + تكبير بسيط ---------- */
  wrap("revealAns", function () {
    var box = document.getElementById("q-answer-box");
    if (!box) return;
    gsap.fromTo(
      box,
      { opacity: 0, scale: 0.85, y: -8 },
      { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(2)" }
    );
  });

  /* ---------- 3) إعطاء نقطة: نبضة على رقم نقاط الفريق اللي فاز بالسؤال ---------- */
  wrap("givePoint", function (team) {
    var scoreEl = document.getElementById(team === 1 ? "bot-s1" : "bot-s2");
    if (!scoreEl) return;
    gsap.fromTo(
      scoreEl,
      { scale: 1.6, color: "#4ade80" },
      { scale: 1, color: "", duration: 0.55, ease: "elastic.out(1,0.5)", clearProps: "color" }
    );
  });

  /* ---------- 4) شاشة النتيجة النهائية: دخول احتفالي للبطاقة والكأس ---------- */
  wrap("showResult", function () {
    var card = document.querySelector(".res-card");
    var icon = document.getElementById("r-ico");
    if (card) {
      gsap.fromTo(
        card,
        { opacity: 0, scale: 0.6, y: 60 },
        { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "elastic.out(1,0.65)" }
      );
    }
    if (icon) {
      gsap.fromTo(
        icon,
        { rotate: -25, scale: 0 },
        { rotate: 0, scale: 1, duration: 0.8, delay: 0.1, ease: "back.out(2.5)" }
      );
    }
  });

  /* ---------- 5) نبضة على "+نقاط" العائمة (showPop) لحركة أقوى شوي ---------- */
  wrap("showPop", function () {
    // آخر عنصر pts-pop مضاف للـ body هو اللي أنشأته اللعبة الحين
    var pops = document.querySelectorAll(".pts-pop");
    var el = pops[pops.length - 1];
    if (!el) return;
    gsap.fromTo(el, { scale: 0.3 }, { scale: 1.15, duration: 0.25, ease: "back.out(3)" });
  });
})();

</script>

<script>
/* =====================================================================
   REXDH GAME — طبقة حركة إضافية على بطاقات الفئات والأزرار (GSAP)
   نفس أسلوب الطبقة أعلاه: لا تلمس أي كود لعبة أصلي، تعمل فقط على عناصر
   DOM الجاهزة بحلول وقت تنفيذ هذا السكربت (buildCatPicker يبني البطاقات
   قبل هذا السكربت أثناء تحميل الصفحة).
   ===================================================================== */
(function () {
  "use strict";
  if (typeof gsap === "undefined") return;

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- دخول متدرّج لبطاقات الفئات ---------- */
  function animateCardsIn() {
    var cards = document.querySelectorAll(".cp-card");
    if (!cards.length) return;
    if (reduceMotion) { gsap.set(cards, { opacity: 1 }); return; }
    gsap.set(cards, { animation: "none", opacity: 0 }); // نوقف كي فريم CSS الأصلي كي لا يتصادم مع GSAP
    gsap.fromTo(
      cards,
      { opacity: 0, y: 30 },
      { opacity: 1, y: 0, duration: 0.5, stagger: 0.05, ease: "power3.out" }
    );
  }

  /* ---------- ميل 3D لبطاقة الفئة عند تتبّع الماوس ---------- */
  function initCardTilt() {
    if (reduceMotion) return;
    document.querySelectorAll(".cp-card").forEach(function (card) {
      var bounds = null;
      card.addEventListener("mouseenter", function () {
        bounds = card.getBoundingClientRect();
        gsap.to(card, { y: -8, scale: 1.03, duration: 0.25, ease: "power2.out", overwrite: "auto" });
      });
      card.addEventListener("mousemove", function (e) {
        if (!bounds) bounds = card.getBoundingClientRect();
        var px = (e.clientX - bounds.left) / bounds.width;
        var py = (e.clientY - bounds.top) / bounds.height;
        gsap.to(card, {
          rotateX: (0.5 - py) * 14,
          rotateY: (px - 0.5) * 14,
          duration: 0.3, ease: "power2.out", overwrite: "auto"
        });
      });
      card.addEventListener("mouseleave", function () {
        gsap.to(card, { y: 0, scale: 1, rotateX: 0, rotateY: 0, duration: 0.4, ease: "power2.out", overwrite: "auto" });
      });
    });
  }

  /* ---------- أزرار: hover(scale+glow) + click(ارتداد) — مفوَّضة كي تعمل على
     العناصر المُنشأة لاحقاً (score-btn تُعاد بناؤها كل تحديث للوحة) ---------- */
  var BTN_SEL = ".start-btn,.score-btn,.rb,.ll-btn,.q-ll-btn,.team-pill,.turn-pill,.h-btn,.qa,.stp,.split-go,.sc-adj,.add-btn,.pl-del,.cp-info";
  function usable(el) { return el && !el.disabled && !el.classList.contains("used"); }
  if (!reduceMotion) {
    document.addEventListener("mouseenter", function (e) {
      var el = e.target.closest && e.target.closest(BTN_SEL);
      if (!usable(el)) return;
      gsap.to(el, { scale: 1.05, duration: 0.18, ease: "power2.out", overwrite: "auto" });
    }, true);
    document.addEventListener("mouseleave", function (e) {
      var el = e.target.closest && e.target.closest(BTN_SEL);
      if (!el) return;
      gsap.to(el, { scale: 1, duration: 0.22, ease: "power2.out", overwrite: "auto" });
    }, true);
    document.addEventListener("mousedown", function (e) {
      var el = e.target.closest && e.target.closest(BTN_SEL);
      if (!usable(el)) return;
      gsap.to(el, { scale: 0.92, duration: 0.1, ease: "power2.out", overwrite: "auto" });
    });
    document.addEventListener("mouseup", function (e) {
      var el = e.target.closest && e.target.closest(BTN_SEL);
      if (!el) return;
      gsap.to(el, { scale: 1.05, duration: 0.25, ease: "back.out(3)", overwrite: "auto" });
    });
  }

  animateCardsIn();
  initCardTilt();

  /* ---------- StarBorder: غلاف يُنشأ مرة واحدة حول زر البدء ---------- */
  function initStarBorder() {
    var btn = document.querySelector(".start-btn");
    if (!btn || btn.parentNode.classList.contains("star-border")) return;
    var wrap = document.createElement("div");
    wrap.className = "star-border";
    btn.parentNode.insertBefore(wrap, btn);
    var b = document.createElement("i"); b.className = "sb-bottom";
    var t = document.createElement("i"); t.className = "sb-top";
    wrap.appendChild(b); wrap.appendChild(t);
    wrap.appendChild(btn); // نقل الزر نفسه (لا إعادة إنشاء) — onclick ومنطق اللعبة سليمان
  }
  initStarBorder();

  /* ---------- MagicBento: توهّج حدود + بقعة ضوء + جسيمات + موجة نقر ---------- */
  var GLOW = "42,143,224", PARTICLES = 10, SPOT_R = 300;

  function initBentoFx() {
    if (reduceMotion) return;
    var picker = document.getElementById("cat-picker");
    if (!picker) return;

    document.querySelectorAll(".cp-card").forEach(function (card) {
      if (card.querySelector(".cp-glow")) return;
      var g = document.createElement("i");
      g.className = "cp-glow";
      card.appendChild(g);

      var live = [], timers = [];
      card.addEventListener("mouseenter", function () {
        for (var i = 0; i < PARTICLES; i++) {
          timers.push(setTimeout((function () {
            var r = card.getBoundingClientRect();
            var p = document.createElement("i");
            p.className = "cp-particle";
            p.style.left = (Math.random() * r.width) + "px";
            p.style.top = (Math.random() * r.height) + "px";
            card.appendChild(p);
            live.push(p);
            gsap.fromTo(p, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.7)" });
            gsap.to(p, {
              x: (Math.random() - 0.5) * 60, y: (Math.random() - 0.5) * 60,
              rotation: Math.random() * 360, duration: 2 + Math.random() * 2,
              ease: "none", repeat: -1, yoyo: true
            });
          }), i * 90));
        }
      });
      card.addEventListener("mouseleave", function () {
        timers.forEach(clearTimeout); timers = [];
        live.forEach(function (p) {
          gsap.to(p, { scale: 0, opacity: 0, duration: 0.3, ease: "back.in(1.7)",
            onComplete: function () { if (p.parentNode) p.parentNode.removeChild(p); } });
        });
        live = [];
      });
      card.addEventListener("click", function (e) {
        var r = card.getBoundingClientRect();
        var x = e.clientX - r.left, y = e.clientY - r.top;
        var maxD = Math.max(Math.hypot(x, y), Math.hypot(x - r.width, y),
                            Math.hypot(x, y - r.height), Math.hypot(x - r.width, y - r.height));
        var rip = document.createElement("i");
        rip.className = "cp-ripple";
        rip.style.width = rip.style.height = (maxD * 2) + "px";
        rip.style.left = (x - maxD) + "px";
        rip.style.top = (y - maxD) + "px";
        card.appendChild(rip);
        gsap.fromTo(rip, { scale: 0, opacity: 1 },
          { scale: 1, opacity: 0, duration: 0.8, ease: "power2.out",
            onComplete: function () { if (rip.parentNode) rip.parentNode.removeChild(rip); } });
      });
    });

    /* بقعة ضوء عامة تتبع المؤشر داخل شبكة الفئات فقط */
    var spot = document.getElementById("cp-spotlight");
    if (!spot) {
      spot = document.createElement("div");
      spot.id = "cp-spotlight";
      document.body.appendChild(spot);
    }
    var prox = SPOT_R * 0.5, fade = SPOT_R * 0.75;
    document.addEventListener("mousemove", function (e) {
      var rect = picker.getBoundingClientRect();
      var inside = e.clientX >= rect.left && e.clientX <= rect.right &&
                   e.clientY >= rect.top && e.clientY <= rect.bottom;
      var cards = picker.querySelectorAll(".cp-card");
      if (!inside) {
        gsap.to(spot, { opacity: 0, duration: 0.3, ease: "power2.out" });
        cards.forEach(function (c) { c.style.setProperty("--glow-intensity", "0"); });
        return;
      }
      var minD = Infinity;
      cards.forEach(function (c) {
        var cr = c.getBoundingClientRect();
        var d = Math.max(0, Math.hypot(e.clientX - (cr.left + cr.width / 2),
                                       e.clientY - (cr.top + cr.height / 2)) - Math.max(cr.width, cr.height) / 2);
        minD = Math.min(minD, d);
        var gi = d <= prox ? 1 : d <= fade ? (fade - d) / (fade - prox) : 0;
        c.style.setProperty("--glow-x", (((e.clientX - cr.left) / cr.width) * 100) + "%");
        c.style.setProperty("--glow-y", (((e.clientY - cr.top) / cr.height) * 100) + "%");
        c.style.setProperty("--glow-intensity", String(gi));
      });
      gsap.to(spot, { left: e.clientX, top: e.clientY, duration: 0.1, ease: "power2.out" });
      var op = minD <= prox ? 0.8 : minD <= fade ? ((fade - minD) / (fade - prox)) * 0.8 : 0;
      gsap.to(spot, { opacity: op, duration: op > 0 ? 0.2 : 0.5, ease: "power2.out" });
    });
  }
  initBentoFx();
})();
</script>

<script type="module">
/* =====================================================================
   REXDH GAME — خلفية Three.js ثلاثية الأبعاد (زخرفية بحتة، مستقلة تماماً
   عن منطق اللعبة). Three.js محلي (vendor/three.module.min.js) بلا CDN
   خارجي كي لا نحتاج فتح CSP على مضيف خارجي.
   ===================================================================== */
import * as THREE from './vendor/three.module.min.js';

(function () {
  var canvas = document.getElementById('three-bg');
  if (!canvas || !window.WebGLRenderingContext) return;

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  } catch (e) { return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 7);

  /* إضاءة بألوان الثيم الحالي: أزرق كهربائي #2a8fe0 + فضي #e6e6e6 */
  scene.add(new THREE.AmbientLight(0x1c6bb0, 0.6));
  var key = new THREE.PointLight(0x2a8fe0, 3, 20);
  key.position.set(3, 2, 4);
  scene.add(key);
  var rim = new THREE.PointLight(0xe6e6e6, 1.4, 20);
  rim.position.set(-4, -2, -3);
  scene.add(rim);

  /* شكل مضلّع منخفض الأوجه (icosahedron) بخطوط سلكية خفيفة — زخرفي، لا يحجب المحتوى */
  var geo = new THREE.IcosahedronGeometry(2.1, 1);
  var mat = new THREE.MeshStandardMaterial({
    color: 0x131318, emissive: 0x2a8fe0, emissiveIntensity: 0.18,
    roughness: 0.35, metalness: 0.6, wireframe: false, flatShading: true, transparent: true, opacity: 0.5
  });
  var mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);
  var wire = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xe6e6e6, wireframe: true, transparent: true, opacity: 0.08 }));
  mesh.add(wire);

  /* حقل جسيمات خفيف حول الشكل لعمق إضافي */
  var particleCount = 140;
  var positions = new Float32Array(particleCount * 3);
  for (var i = 0; i < particleCount; i++) {
    var r = 4.5 + Math.random() * 4;
    var theta = Math.random() * Math.PI * 2;
    var phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);
  }
  var pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  var pMat = new THREE.PointsMaterial({ color: 0x6fb6dd, size: 0.035, transparent: true, opacity: 0.5 });
  var particles = new THREE.Points(pGeo, pMat);
  scene.add(particles);

  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener('resize', onResize);

  var running = false;
  var rafId = null;
  function tick() {
    mesh.rotation.x += 0.0012;
    mesh.rotation.y += 0.002;
    particles.rotation.y -= 0.0006;
    renderer.render(scene, camera);
    if (running) rafId = requestAnimationFrame(tick);
  }
  function start() {
    if (running || reduceMotion) return;
    running = true;
    tick();
  }
  function stop() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
  }

  if (reduceMotion) {
    renderer.render(scene, camera); // إطار ثابت واحد فقط، بلا حلقة رندر
  } else {
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) stop(); else start();
    });
    start();
  }
})();
</script>

</body>
